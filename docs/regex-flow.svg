<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <style>
      .bg { fill: #0f1418; }
      .box { fill: #22303a; stroke: #dce5ee; stroke-width: 2; rx: 12; }
      .title { fill: #f4f7fb; font: 700 30px Arial, sans-serif; }
      .txt { fill: #f4f7fb; font: 24px Arial, sans-serif; }
      .small { fill: #f4f7fb; font: 21px Arial, sans-serif; }
      .arrow { stroke: #dce5ee; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dce5ee"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="620"/>
  <text class="title" x="30" y="50">ЛР4: Схема поиска по регулярным выражениям</text>

  <rect class="box" x="70" y="120" width="250" height="90"/>
  <text class="txt" x="130" y="175">Выбор режима</text>

  <rect class="box" x="380" y="120" width="300" height="90"/>
  <text class="txt" x="470" y="175">Пуск / run_analysis</text>

  <rect class="box" x="740" y="120" width="470" height="110"/>
  <text class="txt" x="820" y="175">RegexSearchEngine.find()</text>
  <text class="small" x="790" y="210">SSN / FileSize / VIN</text>

  <rect class="box" x="170" y="340" width="380" height="110"/>
  <text class="txt" x="245" y="400">Таблица совпадений</text>
  <text class="small" x="245" y="430">подстрока / позиция / длина</text>

  <rect class="box" x="650" y="340" width="470" height="110"/>
  <text class="txt" x="725" y="400">Клик по строке таблицы</text>
  <text class="small" x="725" y="430">выделение фрагмента в редакторе</text>

  <path class="arrow" d="M320 165 L380 165"/>
  <path class="arrow" d="M680 165 L740 165"/>
  <path class="arrow" d="M850 230 L850 340"/>
  <path class="arrow" d="M740 390 L550 390"/>
  <path class="arrow" d="M550 395 L650 395"/>
</svg>
