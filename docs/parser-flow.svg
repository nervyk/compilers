<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #101418; }
      .box { fill: #1b2430; stroke: #d9e1ea; stroke-width: 2; rx: 12; }
      .title { fill: #f4f7fb; font: 700 30px Arial, sans-serif; }
      .txt { fill: #f4f7fb; font: 24px Arial, sans-serif; }
      .arrow { stroke: #d9e1ea; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9e1ea"/>
