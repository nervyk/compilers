  <path class="arrow" d="M320 165 L390 165"/>
  <path class="arrow" d="M670 165 L740 165"/>
  <path class="arrow" d="M900 210 L900 300"/>
  <path class="arrow" d="M740 355 L470 355"/>
  <path class="arrow" d="M325 400 L325 520"/>
  <path class="arrow" d="M820 355 L880 355"/>
